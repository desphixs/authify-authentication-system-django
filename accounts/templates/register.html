<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account - Authify</title>
    <!-- We load Tailwind CSS CDN to style our page with utility classes without writing custom CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- We load Font Awesome CDN for highly descriptive icons like envelopes, users, and locks -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- We load a beautiful, modern Google Font called Plus Jakarta Sans for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Setting the default font to Plus Jakarta Sans for the entire page */
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex items-center justify-center p-4 relative overflow-hidden select-none">
    <!-- Background subtle neon glow circles to add a premium, modern aesthetic depth -->
    <div class="absolute top-1/4 left-1/4 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-violet-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 translate-x-1/2 translate-y-1/2 w-96 h-96 bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- Main registration card container -->
    <div class="w-full max-w-md bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-2xl p-8 shadow-2xl relative z-10">
        <!-- Brand Logo / Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-gradient-to-tr from-violet-600 to-indigo-500 rounded-xl mb-3 shadow-lg shadow-violet-500/20">
                <i class="fa-solid fa-shield-halved text-white text-xl"></i>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-violet-400 via-indigo-200 to-white bg-clip-text text-transparent">
                Join Authify
            </h1>
            <p class="text-slate-400 text-sm mt-1.5 font-medium">Create your secure, logic-first account today.</p>
        </div>

        <!-- Dynamic Error Alert box: Rendered only if Django views pass an error string -->
        {% if error %}
        <div class="mb-6 p-4 bg-red-950/40 border border-red-800/50 rounded-xl flex items-start space-x-3 text-red-300 text-sm animate-shake">
            <i class="fa-solid fa-circle-exclamation mt-0.5 text-red-400"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Registration Form -->
        <!-- We use the POST method to transmit user details securely, preventing data from leaking into server logs -->
        <form method="POST" action="" class="space-y-5">
            <!-- CSRF Token: Django's critical cryptographic guard against Cross-Site Request Forgery attacks -->
            {% csrf_token %}

            <!-- Email Input Field -->
            <div>
                <label for="email" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                        <i class="fa-regular fa-envelope"></i>
                    </span>
                    <input type="email" id="email" name="email" required placeholder="name@example.com"
                        class="w-full pl-10 pr-4 py-3 bg-slate-950/50 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-600 focus:outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20 transition-all duration-200 text-sm font-medium">
                </div>
            </div>

            <!-- Username Input Field -->
            <div>
                <label for="username" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                        <i class="fa-regular fa-user"></i>
                    </span>
                    <input type="text" id="username" name="username" required placeholder="choose a nickname"
                        class="w-full pl-10 pr-4 py-3 bg-slate-950/50 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-600 focus:outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20 transition-all duration-200 text-sm font-medium">
                </div>
            </div>

            <!-- Password Input Field -->
            <div>
                <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                        class="w-full pl-10 pr-4 py-3 bg-slate-950/50 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-600 focus:outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20 transition-all duration-200 text-sm font-medium">
                </div>
            </div>

            <!-- Submit Register Button -->
            <button type="submit" 
                class="w-full py-3 px-4 mt-2 bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-semibold rounded-xl transition-all duration-200 shadow-lg shadow-violet-500/10 hover:shadow-violet-500/20 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:ring-offset-2 focus:ring-offset-slate-900 text-sm">
                Create Account <i class="fa-solid fa-arrow-right ml-2 text-xs"></i>
            </button>
        </form>

        <!-- Redirect to Login Page Link -->
        <p class="text-center text-slate-400 text-sm mt-8 font-medium">
            Already have an account? 
            <a href="/login/" class="text-violet-400 hover:text-violet-300 font-semibold transition-colors duration-150 ml-1">Sign In</a>
        </p>
    </div>
</body>
</html>
